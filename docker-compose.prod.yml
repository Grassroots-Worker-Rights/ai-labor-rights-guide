name: ai-labor-rights-prod

# Production stack (image-based): Meilisearch + Chroma + Spring backend + Angular frontend + nginx +
# Let's Encrypt. Deployed by .github/workflows/deploy.yml — the file is copied to
# /opt/apps/ai-labor-rights on the server; there is no git checkout there. See docs/CICD.md.
#
# This stack's nginx is the server's ONLY public entry point (80/443). It terminates TLS for both
# ${DOMAIN} and ${STAGE_DOMAIN} (one certificate covering both names) and forwards stage traffic to
# the stage stack over the shared "ai-labor-rights-edge" network.
#
# Server-side (persistent, not shipped by CI): .env, models/, certbot/.
# Shipped by CI: this file, nginx/templates/, scripts/init-ssl.sh.
#
# Manual use on the server:
#   export BACKEND_IMAGE_TAG=v1.2.3 FRONTEND_IMAGE_TAG=v1.2.3   # default: latest
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

x-images:
  backend: &backend-image ghcr.io/${IMAGE_NAMESPACE:-grassroots-worker-rights}/ai-labor-rights-backend:${BACKEND_IMAGE_TAG:-latest}
  frontend: &frontend-image ghcr.io/${IMAGE_NAMESPACE:-grassroots-worker-rights}/ai-labor-rights-frontend:${FRONTEND_IMAGE_TAG:-latest}

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks: [internal]
    restart: unless-stopped
    # Meili memory-maps its index; the cap is a safety ceiling, not a target — the OS page cache
    # (reclaimable) handles the hot index pages.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB — alternative chat-RAG backend (APP_RAG_PROVIDER=chroma). Run alongside Meili for the
  # trial so ingestion populates both and the env var can flip live. Internal network only.
  chromadb:
    image: chromadb/chroma:0.6.3
    environment:
      IS_PERSISTENT: "TRUE"
      # ALLOW_RESET deliberately OFF in prod — the reset endpoint can wipe the vector store.
    volumes:
      - chroma_data:/chroma/chroma
    networks: [internal]
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: *backend-image
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      # Same-origin in prod (nginx serves both), so no CORS origins needed.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Chat RAG backend: meili (default) | chroma. The /api/search box stays on Meili regardless.
      APP_RAG_PROVIDER: ${APP_RAG_PROVIDER:-meili}
      APP_RATELIMIT_ENABLED: ${APP_RATELIMIT_ENABLED:-true}
      CHROMA_HOST: http://chromadb
      CHROMA_PORT: "8000"
    volumes:
      # Local ONNX embedding model (read-only), shared with stage. If ./models is empty the app
      # downloads it at startup.
      - ./models:/app/models:ro
    depends_on:
      meilisearch:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [internal]
    restart: unless-stopped
    # JVM heap is 60% of this limit (Dockerfile); the rest covers the ONNX embedder's off-heap memory.
    mem_limit: 2560m

  frontend:
    image: *frontend-image
    networks: [internal]
    depends_on: [backend]
    restart: unless-stopped
    mem_limit: 128m  # static nginx — tiny resident set

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      STAGE_DOMAIN: ${STAGE_DOMAIN:?Set STAGE_DOMAIN in .env (e.g. stage.example.org)}
      # Only substitute these; leave nginx's own $host, $uri, ... alone.
      NGINX_ENVSUBST_TEMPLATE_VARS: DOMAIN STAGE_DOMAIN
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # internal → prod backend/frontend; edge → stage-backend/stage-frontend.
    networks: [internal, edge]
    depends_on: [backend, frontend]
    restart: unless-stopped
    mem_limit: 192m  # proxy + small disk cache (cache lives on disk, not RAM)
    # Reload nginx every 6 h to pick up renewed certs (certbot renews every 12 h)
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # The only certbot on the server: it renews the single certificate that covers both domains.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks: [internal]
    restart: unless-stopped
    mem_limit: 128m
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

networks:
  internal:
    driver: bridge
  # Shared with the stage stack. Created by the deploy workflow / init-ssl.sh:
  #   docker network create ai-labor-rights-edge
  edge:
    name: ai-labor-rights-edge
    external: true

volumes:
  meili_data:
  chroma_data:
